# GoReleaser configuration for engram.
# Validate:   goreleaser check
# Dry-run:    goreleaser release --snapshot --clean --skip=publish
# Release:    push a v* tag (handled by .github/workflows/release.yml)
version: 2

project_name: engram

before:
  hooks:
    - go mod tidy

builds:
  - id: engram
    main: .
    binary: engram
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: engram
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: engram
    binaries:
      - engram
    repository:
      owner: ertugrulhaskan
      name: homebrew-tap
      # Token with write access to the tap repo (the built-in GITHUB_TOKEN can't
      # push to a separate repository). HOMEBREW_TAP_TOKEN is set in the engram
      # repo's Actions secrets.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://engram.im"
    description: "Terminal UI for browsing, searching, and sharing your Claude Code memories"
    # The release binaries are unsigned; clear the macOS quarantine flag on install.
    # This step is load-bearing. Measured 2026-09-05 on macOS 26.6 / Apple Silicon by
    # reinstalling the cask with the hook removed: the staged binary keeps
    # com.apple.quarantine and refuses to exec even though it is present and +x
    # (observed as exit 127, "no such file or directory"; Gatekeeper also reports this
    # as "killed: 9" elsewhere, and the GUI panel says Apple "could not verify" the
    # binary "is free of malware"). Clearing the flag was the only variable changed,
    # and with it cleared the binary runs.
    #
    # Homebrew 6.0 deprecated the `postflight` stanza this generates, so every `brew`
    # command touching the tap prints "Calling `postflight` is deprecated! Use
    # `postflight_steps` instead". GoReleaser v2.18 cannot emit the replacement —
    # HomebrewCaskHook carries only `install`/`uninstall`. Tracked in
    # goreleaser/goreleaser#6870; PR #6873 is open and unmerged, and the maintainer
    # aimed it at v2.19 — a target, not a commitment, so confirm it actually shipped
    # rather than assuming. When it does, replace `install:` below with:
    #
    #     install_steps: |
    #       on_macos do
    #         run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/engram"]
    #       end
    #
    # Mind the two spellings — they are NOT interchangeable. `.StagedPath` is a
    # GoReleaser template field, valid only here; it renders to Homebrew's own
    # `{{staged_path}}` token, which is what raw Ruby inside the generated .rb needs.
    # (GoReleaser runs a second template pass over the finished cask, which is why the
    # Homebrew token cannot simply be written literally in this file.) Putting the
    # `.StagedPath` form into a .rb hands xattr a path that does not exist and stops
    # clearing quarantine.
    #
    # Because release.yml floats on "~> v2", that GoReleaser version arrives on its own
    # — meaning the first tag after it lands is also the first time it ever runs here.
    # Do the `goreleaser check` + snapshot dry-run from CONTRIBUTING.md before tagging.
    # Expect `goreleaser check` to start reporting `hooks.post.install` as deprecated
    # once #6873 is in; that notice is this comment, not a new problem.
    #
    # Verify after switching: `brew reinstall engram`, then `xattr -l` the Caskroom
    # binary and confirm no com.apple.quarantine. Nothing detects a regression here —
    # the release still succeeds and the cask still installs, so the failure surfaces
    # only on other people's machines, never in CI.
    #
    # Until then the tap's cask carries a hand-patched `postflight_steps` block
    # (ertugrulhaskan/homebrew-tap 25d1794, 2026-09-05). Every release regenerates that
    # file and silently reverts the patch — see the re-apply step in CONTRIBUTING.md's
    # "Releasing".
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/engram"]
          end

release:
  draft: false
  prerelease: auto
