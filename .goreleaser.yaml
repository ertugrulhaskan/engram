# GoReleaser configuration for engram.
# Validate:   goreleaser check
# Dry-run:    goreleaser release --snapshot --clean --skip=publish
# Release:    push a v* tag (handled by .github/workflows/release.yml)
version: 2

project_name: engram

before:
  hooks:
    - go mod tidy

builds:
  - id: engram
    main: .
    binary: engram
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: engram
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: engram
    binaries:
      - engram
    repository:
      owner: ertugrulhaskan
      name: homebrew-tap
      # Token with write access to the tap repo (the built-in GITHUB_TOKEN can't
      # push to a separate repository). HOMEBREW_TAP_TOKEN is set in the engram
      # repo's Actions secrets.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://engram.im"
    description: "Terminal UI for browsing, searching, and sharing your Claude Code memories"
    # The release binaries are unsigned; clear the macOS quarantine flag on install.
    # This step is load-bearing. Measured 2026-09-05 on macOS 26.6 / Apple Silicon by
    # reinstalling the cask with the hook removed: the staged binary keeps
    # com.apple.quarantine and refuses to exec even though it is present and +x
    # (observed as exit 127, "no such file or directory"; Gatekeeper also reports this
    # as "killed: 9" elsewhere, and the GUI panel says Apple "could not verify" the
    # binary "is free of malware"). Clearing the flag was the only variable changed,
    # and with it cleared the binary runs.
    #
    # `install_steps` emits Homebrew's declarative `postflight_steps` block. It needs
    # GoReleaser v2.19 or later (goreleaser/goreleaser#6873); release.yml pins the exact
    # version it was verified on. The raw-Ruby `install:` hook it replaces generated the
    # `postflight` stanza Homebrew 6.0 deprecated, so every `brew` command touching the
    # tap printed "Calling `postflight` is deprecated!", and the tap's cask had to be
    # hand-patched to `postflight_steps` after every release.
    #
    # Mind the two spellings — they are NOT interchangeable. `.StagedPath` is a
    # GoReleaser template field, valid only here; it renders to Homebrew's own
    # `{{staged_path}}` token, which is what the generated .rb needs. (GoReleaser runs a
    # second template pass over the finished cask, which is why the Homebrew token
    # cannot simply be written literally in this file.) Putting the `.StagedPath` form
    # into a .rb hands xattr a path that does not exist and stops clearing quarantine.
    #
    # Verify after any change here, or after bumping the GoReleaser version release.yml
    # pins, on the first real release that follows: `brew reinstall --cask
    # ertugrulhaskan/tap/engram`, then `xattr -l` the Caskroom binary (only
    # com.apple.provenance should remain), then run `"$(brew --prefix)/bin/engram"
    # --version` — a quarantined binary does not exec at all, so a version print is the
    # real evidence. Name that path: a bare `engram` may resolve to a `go install` copy
    # that was never quarantined, and pass while the cask's hook is broken. Nothing
    # else detects a regression: the release still succeeds and the cask still
    # installs, so the failure surfaces only on other people's machines, never in CI.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/engram"]
          end

release:
  draft: false
  prerelease: auto
