# Dependabot version updates.
#
# The trigger for adding this: goldmark and x/net sat on published advisories until
# they were found by hand and fixed in 0d79d78. Nothing was watching, and a project
# that goes quiet for a while is exactly where that gap hurts.
#
# THIS FILE IS ONLY HALF THE JOB. It configures *version* updates. Dependabot
# *security* alerts and their automatic fix PRs are a repository setting, not a file:
# Settings > Advanced Security > Dependabot alerts / Dependabot security updates. A
# repo with this file and that toggle off still learns about a new CVE from nobody.
#
# Tuned for low noise on purpose, because engram is not worked on every week: monthly
# rather than weekly, every ecosystem grouped into a single pull request, and a small
# open-PR limit. None of that blocks anything, it only batches it.
#
# Note there is deliberately NO `ignore:` rule anywhere in this file. An `ignore` filters
# security updates as well as version updates, so using one to hold back, say, major
# action bumps would also mute the security PR for a CVE fixed only in that major. Risky
# upgrades are handled by reviewing the pull request, which is the step Dependabot cannot
# skip: nothing here merges itself.

version: 2
updates:
  # The binary's own dependencies. This is the one that matters: it is what ships to
  # users through the release archives, the Homebrew cask and `go install`.
  #
  # GLAMOUR STAYS ON 0.8 until the Charm v2 upgrade (ENGR-43). Glamour 1.0 drops the
  # blockquote `│` bar on wrapped lines; #12 merged it anyway because the suite passed,
  # it shipped in v0.6.0, and v0.6.1 went back to 0.8. A grouped PR here will offer
  # Glamour 1.0 again. Take the rest of that group, not the Glamour bump:
  # TestBlockquoteKeepsBarWhenWrapped (internal/tui/quote_wrap_test.go) fails on 1.0,
  # and that red CI is the reason, not noise. (Still no `ignore:`, for the reason above.)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns: ["*"]

  # The release path itself. A stale actions/checkout or setup-go is a supply-chain
  # surface for a workflow that holds HOMEBREW_TAP_TOKEN and publishes binaries.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
    # A BUMP THAT TOUCHES release.yml is rehearsed before merge, but only partly.
    # release.yml itself never runs until a `v*` tag is pushed. The `snapshot` job in
    # ci.yml uses the same checkout, setup-go and goreleaser-action SHAs, so a grouped
    # bump runs the new checkout and setup-go on its own PR, and installs GoReleaser
    # through the new goreleaser-action. It then runs the `goreleaser` binary from the
    # shell, so the action's own run path (`args: release --clean`, env passing) is NOT
    # exercised, and neither is the publish half: the tap-token gate and the real
    # release. A failure in either still lands after GoReleaser has created the GitHub
    # Release, the half-published state verify-tap-token.sh exists to prevent, so read
    # goreleaser-action's release notes before merging a major bump of it.

  # Tailwind, used only to build www/css/styles.css. It never reaches a user's machine:
  # the built CSS is committed and Cloudflare Pages runs no build step. Lowest stakes of
  # the three, kept because the built file is a public artifact.
  #
  # Expect these pull requests to fail CI, and read that as the system working. A bump
  # changes package-lock.json but cannot regenerate the committed stylesheet, so the
  # `site` job in ci.yml reports it as stale. Run `npm run build:css` and commit the
  # result into the same pull request; that is the step there is no other way to catch,
  # since Pages has no build step and would just keep serving the old file.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      tailwind:
        patterns: ["*"]
