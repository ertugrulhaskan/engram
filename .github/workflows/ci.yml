name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated rather than inherited: nothing here writes to the repo, and
# pinning it means a change to the repository-wide default cannot quietly widen these
# jobs. release.yml asks for contents: write because it genuinely publishes;
# verify-tap-token.yml asks for nothing at all.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag is mutable, so `@v4` means
      # trusting the owner never to move it. The trailing comment is the human-readable
      # version, and Dependabot updates both together.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the same patch version release.yml builds with, so CI exercises exactly
      # the toolchain that produces the published binaries. Bump both together.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Nothing was watching before this. goldmark and x/net each sat on published
      # advisories until someone looked by hand — first 0d79d78, then again in b84366a,
      # by which point eleven had accumulated across x/net and x/sys. Dependabot does not
      # close the gap on its own: its gomod group runs monthly and security alerts are a
      # repository toggle, not this file.
      #
      # `-scan module`, not the default symbol scan, and that is the whole point. Every
      # one of those eleven was imported but never called, so the default mode lists them
      # as informational and still exits 0 — measured on a tree with x/net v0.38.0
      # restored: default exits 0 with ten advisories present, `-scan module` exits
      # non-zero. Module granularity is what Dependabot alerts on, and the cost is a red
      # build for an advisory engram may never reach. That is the intended trade.
      # (`-scan module` reads go.mod and takes no package pattern.)
      #
      # The scanner version is pinned for reproducibility, but unlike the action SHAs
      # above nothing updates it: Dependabot's gomod group only covers modules in go.mod,
      # and this is not one. Bump it by hand. The vulnerability database is fetched at run
      # time, so a pinned scanner still learns about new advisories.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -scan module

  # `build` runs 1.27, so nothing there proves the project still works with the toolchain
  # README, CONTRIBUTING and SPEC tell users to install. The failure this catches is a
  # *dependency* raising its own Go floor — precisely what x/net has done twice, dragging
  # the module from 1.23 to 1.25 in b84366a and then to 1.26 when v0.60.0 carried the next
  # round of fixes. It is NOT about too-new stdlib symbols in our own code:
  # `go vet` already reports those through its stdversion analyzer on either toolchain
  # (verified: "fips140.Enforced requires go1.26 or later"), so `build` covers that.
  #
  # GOTOOLCHAIN=local is load-bearing, not tidiness. Go's default is `auto`, which
  # silently downloads and runs a newer toolchain whenever go.mod asks for one — so
  # without this the job would go green at the exact moment the floor moved, which is the
  # one moment it exists for.
  #
  # A separate job rather than a matrix leg on `build`, deliberately: a matrix renames the
  # check to "build (1.26)", and branch protection requires one named exactly `build`,
  # which would then never report and would block every PR.
  floor:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go-version-file reads go.mod's `go` directive, so the floor is stated once, in
      # go.mod, rather than restated here where the next floor move would leave it behind.
      - name: Set up Go at the floor go.mod declares
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  # release.yml runs only on a pushed v* tag, so until this job existed nothing exercised
  # .goreleaser.yaml before a real release: a broken config, a deprecated property, or a
  # cask hook that renders wrong was first seen after the GitHub Release already existed.
  # The worst case is silent. A `postflight_steps` block with the wrong `staged_path`
  # spelling still installs cleanly and leaves the binary quarantined, so macOS refuses
  # to run it, and only other people's machines would ever show it. This job rehearses
  # the release on every push and PR: `goreleaser check` (exit 2 on deprecations, so a
  # warning fails the build, by design), a full snapshot build, and verify-snapshot.sh
  # over what it produced.
  #
  # The GoReleaser version comes from .github/goreleaser-version, the same file
  # release.yml reads, so the rehearsal runs exactly the version that will publish. Only
  # the install step is handed the default token, because goreleaser-action resolves the
  # version through the GitHub Releases API. The GoReleaser runs get no publishing
  # credential: HOMEBREW_TAP_TOKEN is not referenced anywhere in this file, and the
  # default token (read-only under `contents: read`, and persisted by checkout as in
  # every job here) cannot create a release. So nothing here can publish even if the
  # config were edited to try.
  #
  # fetch-depth: 0 for the same reason release.yml has it: GoReleaser needs the full
  # history (it derives the version from the latest tag), and the rehearsal should run
  # in the same conditions as the real thing.
  #
  # A separate job, not a matrix leg on `build`, for the reason `floor` documents.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The same patch version `build` and release.yml pin; a rehearsal on another
      # toolchain would prove less. Bump all three together.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Read the pinned GoReleaser version
        id: goreleaser
        run: .github/scripts/goreleaser-version.sh >> "$GITHUB_OUTPUT"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ steps.goreleaser.outputs.version }}
          install-only: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the GoReleaser configuration
        run: goreleaser check

      - name: Build a snapshot release (publishes nothing)
        run: goreleaser release --snapshot --clean --skip=publish

      - name: Verify the rendered cask hook and the version stamp
        run: .github/scripts/verify-snapshot.sh

  # www/css/styles.css is committed and Cloudflare Pages runs no build step, so a class
  # added to a page without a rebuild ships unstyled, and a Tailwind bump that never
  # regenerates the file leaves production on output from the old compiler. Neither
  # failure is visible anywhere else: the deploy succeeds and the page just looks wrong.
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned build tooling
        run: npm ci

      - name: Rebuild the stylesheet
        run: npm run build:css

      - name: Fail if the committed stylesheet is stale
        run: |
          if ! git diff --quiet -- www/css/styles.css; then
            echo "www/css/styles.css does not match a fresh build from the pinned Tailwind."
            echo "Run 'npm run build:css' and commit the result."
            git diff --stat -- www/css/styles.css
            exit 1
          fi
          echo "Committed stylesheet matches a fresh build."

      # The rebuild-and-diff above cannot see either of these: a page with no @source
      # line rebuilds to identical CSS, and the CSP hashes are never exercised locally
      # because nothing local sends the header.
      - name: Check the CSP hashes, Tailwind sources and FAQ schema
        run: python3 .github/scripts/verify-site.py
