name: release

# Runs only when a v* tag is pushed. Inert otherwise.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # Fail before anything is published. GoReleaser creates the GitHub release
      # first and pushes the cask last, so a tap token without write access leaves a
      # live release with a stale cask that has to be repaired by hand — exactly what
      # happened at v0.3.0. This turns that into a 5-second failure with a clear cause.
      - name: Verify the tap token can write the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is empty or unset in this repo's Actions secrets."
            exit 1
          fi
          err="$(mktemp)"
          trap 'rm -f "$err"' EXIT
          if ! push="$(gh api repos/ertugrulhaskan/homebrew-tap --jq .permissions.push 2>"$err")"; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot read ertugrulhaskan/homebrew-tap: $(cat "$err")"
            echo "::error::A 401 means the token is expired or revoked; a 404 means it cannot see the repo at all."
            exit 1
          fi
          # stdout only: a stderr warning on the success path must not corrupt $push,
          # or a good token gets reported as read-only and a valid release is blocked.
          case "$push" in
            true)
              echo "tap token OK (permissions.push=true) — GoReleaser can push the cask."
              ;;
            false)
              echo "::error::HOMEBREW_TAP_TOKEN can read the tap but not write it (permissions.push=false)."
              echo "::error::Fix: fine-grained PAT, Only select repositories -> homebrew-tap, Contents: Read and write."
              exit 1
              ;;
            *)
              echo "::error::Unexpected permissions.push=${push:-<empty>} — the response carried no permissions object."
              echo "::error::This is NOT the read-only case; check the token type before changing its permissions."
              exit 1
              ;;
          esac

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to ertugrulhaskan/homebrew-tap, for the formula push.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
