name: release

# Runs only when a v* tag is pushed. Inert otherwise.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned to a full patch version, for the same reason the actions above are pinned
      # by SHA: this workflow only ever runs on a real tag, so a Go patch release that
      # changes codegen or breaks the GoReleaser build would first execute during an
      # actual publish — after the GitHub release exists and before the cask is pushed.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      # Fail before anything is published. GoReleaser creates the GitHub release
      # first and pushes the cask last, so a tap token without write access leaves a
      # live release with a stale cask that has to be repaired by hand — exactly what
      # happened at v0.3.0. This turns that into a 5-second failure with a clear cause.
      - name: Verify the tap token can write the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: .github/scripts/verify-tap-token.sh

      # GoReleaser is pinned to the exact version the cask's `install_steps` hook was
      # verified on, for the same reason Go is: this only runs on a real tag, so a new
      # release rendering the quarantine hook differently would surface after publishing.
      # `install_steps` needs v2.19 or later. Nothing bumps this pin automatically —
      # Dependabot sees the action's SHA, not this input. Bump it by hand, after the
      # `goreleaser check` and snapshot dry-run from CONTRIBUTING's "Releasing", and on
      # the first release after a bump re-run the cask check described beside the hook
      # in .goreleaser.yaml (brew reinstall, xattr -l, then run the installed binary).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.19.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to ertugrulhaskan/homebrew-tap, for the cask push.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
